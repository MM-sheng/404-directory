name: Publish npm and MCP Registry

on:
  push:
    tags: ["v*"]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install trusted-publishing compatible npm
        run: npm install --global npm@latest
      - name: Verify tag and package ownership metadata
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$(jq -r .version server.json)"
          test "$VERSION" = "$(jq -r .version packages/404-directory-mcp/package.json)"
          test "$(jq -r .name server.json)" = "$(jq -r .mcpName packages/404-directory-mcp/package.json)"
      - name: Publish identity-preserving bridge to npm
        run: |
          PACKAGE_NAME="$(jq -r .name packages/404-directory-mcp/package.json)"
          VERSION="$(jq -r .version packages/404-directory-mcp/package.json)"
          if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
            MCP_NAME="$(npm view "$PACKAGE_NAME@$VERSION" mcpName 2>/dev/null || true)"
            test "$MCP_NAME" = "$(jq -r .name server.json)"
            echo "$PACKAGE_NAME@$VERSION already exists with matching MCP ownership metadata."
          else
            npm publish --access public ./packages/404-directory-mcp
          fi

  publish-mcp:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag matches server manifest
        run: test "${GITHUB_REF_NAME#v}" = "$(jq -r .version server.json)"
      - name: Install MCP publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Validate manifest
        run: ./mcp-publisher validate server.json
      - name: Publish remote MCP server
        run: ./mcp-publisher publish server.json
